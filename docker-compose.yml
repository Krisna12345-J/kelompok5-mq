version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: mq-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - mq_network

  producer:
    build: ./producer
    container_name: mq-producer
    ports:
      - "5000:5000"
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    networks:
      - mq_network

  consumer:
    build: ./consumer
    container_name: mq-consumer
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    networks:
      - mq_network

volumes:
  rabbitmq_data:

networks:
  mq_network:
    driver: bridge